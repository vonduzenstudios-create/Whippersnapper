<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nocturne of Ash - Enemy Editor</title>
  <style>
    :root { --bg: #0a0610; --panel: #140c1a; --line: #3a2a3a; --gold: #d8b060; --pale: #e8dcc8; --dim: #8a7a90; --red: #6a2030; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--pale); font: 14px/1.45 ui-monospace, Consolas, monospace; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
    header h1 { margin: 0; font-size: 16px; color: var(--gold); letter-spacing: 1px; }
    header .grow { flex: 1; }
    #status { color: var(--dim); }
    #status.ok { color: #80e090; }
    #status.err { color: #ff8080; }
    a { color: var(--gold); }
    button { background: #1e1424; color: var(--pale); border: 1px solid #6a4a2a; padding: 5px 12px; font: inherit; cursor: pointer; }
    button:hover { background: #3a2030; }
    button.primary { background: var(--red); border-color: var(--gold); }
    button:disabled { opacity: 0.4; cursor: default; }
    input, select, textarea { background: var(--bg); color: var(--pale); border: 1px solid #6a4a2a; padding: 4px 6px; font: inherit; }
    input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold); }
    input[readonly] { color: var(--dim); }
    main { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 50px); }
    nav { border-right: 1px solid var(--line); padding: 10px; }
    nav .item { padding: 4px 8px; cursor: pointer; border-left: 2px solid transparent; }
    nav .item:hover { background: #2a1020; }
    nav .item.sel { background: #4a1828; border-left-color: var(--gold); }
    nav .item.variant { padding-left: 22px; color: #c8b8c8; }
    nav .item .mark { color: #ffb080; }
    nav .group { margin: 12px 0 4px; padding: 0 8px; color: var(--gold); font-size: 12px; letter-spacing: 1px; }
    nav .actions { display: grid; gap: 6px; margin-top: 14px; }
    #content { padding: 14px 18px; display: grid; grid-template-columns: minmax(380px, 1fr) minmax(320px, 440px); gap: 18px; align-items: start; }
    section { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px 12px; margin-bottom: 14px; }
    section h2 { margin: 0 0 8px; font-size: 13px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
    .row { display: grid; grid-template-columns: 10em 1fr; gap: 10px; align-items: center; margin: 6px 0; }
    .row .help { grid-column: 2; color: var(--dim); font-size: 12px; margin-top: -4px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stats label { display: grid; gap: 2px; color: var(--dim); }
    .stats input { width: 100%; }
    textarea { width: 100%; min-height: 4.5em; resize: vertical; }
    .drop { display: grid; grid-template-columns: 1fr 6em 2em; gap: 6px; margin: 4px 0; }
    .note { color: var(--dim); font-size: 12px; }
    #preview { width: 100%; image-rendering: pixelated; background: #1a1220; border: 1px solid var(--line); }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
    .sw { display: grid; grid-template-columns: 18px 1fr; gap: 4px; align-items: center; font-size: 11px; color: var(--dim); }
    .sw .from { width: 18px; height: 18px; border: 1px solid #000; }
    .sw input { width: 100%; height: 22px; padding: 0; border: none; background: none; cursor: pointer; }
    .shift { display: grid; grid-template-columns: 6em 1fr 3.5em; gap: 8px; align-items: center; margin: 4px 0; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>ENEMY EDITOR</h1>
    <span id="status"></span>
    <span class="grow"></span>
    <a href="editor.html">Map editor</a>
    <a href="index.html">Game</a>
    <button id="save" class="primary">Save</button>
  </header>
  <main>
    <nav>
      <div id="list"></div>
      <div class="actions">
        <button id="test" class="primary" title="Opens the game in a test chamber with this enemy (unsaved changes included)">Test this enemy</button>
        <button id="variant">+ Make a variant of this</button>
        <button id="delete">Delete variant</button>
        <button id="reset">Reset to code version</button>
      </div>
      <p class="note">Variants keep the AI of the enemy they're based on. Place them in rooms from the map editor's ENEMIES tab.</p>
      <p class="note">TEST opens the game in a separate tab. Inside the chamber: R spawns another, [ and ] switch enemies, 6 clears, 0 refills HP.</p>
    </nav>
    <div id="content"></div>
  </main>
  <script type="module" src="/src/enemy_editor.ts"></script>
</body>
</html>
